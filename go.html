<title>有爱21 · 进入官网</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#04070f;color:#e9f1ff;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}#st{position:fixed;inset:0;z-index:0}.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.logo{font-size:34px;font-weight:800;letter-spacing:.06em;background:linear-gradient(100deg,#9be8ff,#c9b6ff 45%,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{opacity:.72;margin:6px 0 26px}.card{max-width:520px;padding:22px 24px;border-radius:20px;background:rgba(10,18,34,.55);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);box-shadow:0 18px 60px rgba(0,0,0,.45)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7fe3ff;margin-right:8px;animation:pl 1.1s infinite ease-in-out;vertical-align:middle}@keyframes pl{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.b{padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#dfeaff;text-decoration:none;font-size:14px;transition:.25s}.b:hover{border-color:#8fd6ff;color:#fff;transform:translateY(-1px)}.b.p{background:linear-gradient(110deg,#0ea5e9,#22d3ee);color:#04121e;font-weight:700;border:none}.tip{margin-top:14px;font-size:12.5px;opacity:.6}.ft{position:fixed;bottom:14px;left:0;right:0;z-index:2;text-align:center;font-size:12px;opacity:.45}</style>

<body>

<script>(function(){var cv=document.getElementById("st"),x=cv.getContext("2d"),W,H,D=Math.min(devicePixelRatio||1,2),S=[];function rs(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;S=[];for(var i=0;i<190;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.5+.3)*D,v:Math.random()*.14+.02,p:Math.random()*6.28});}rs();addEventListener("resize",rs);function f(t){x.clearRect(0,0,W,H);var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#050a18");g.addColorStop(.55,"#071227");g.addColorStop(1,"#0a0716");x.fillStyle=g;x.fillRect(0,0,W,H);for(var i=0;i<S.length;i++){var s=S[i];s.y+=s.v*D;if(s.y>H)s.y=0;var a=.35+.55*Math.abs(Math.sin(t/900+s.p));x.globalAlpha=a;x.fillStyle=i%9?"#dbeeff":"#9fd8ff";x.beginPath();x.arc(s.x,s.y,s.r,0,6.29);x.fill();}x.globalAlpha=1;raf(f);}var raf=requestAnimationFrame,n=0;function tick(ts){if(document.hidden){n=setTimeout(function(){raf(tick)},600);return;}if(n){clearTimeout(n);n=0;}f(ts);}raf(tick);var msg=document.getElementById("msg"),tip=document.getElementById("tip"),live=document.getElementById("live");function canary(u,tag){return new Promise(function(res){var ok=false,e=document.createElement(tag==="l"?"link":"script"),done=function(v){if(ok)return;ok=true;e.onload=e.onerror=null;if(e.parentNode)e.parentNode.removeChild(e);res(v);};e.onload=function(){done(true)};e.onerror=function(){done(false)};if(tag==="l"){e.rel="stylesheet";}e.src=u+"/style.css?_=";e.src=u+(tag==="l"?"/style.css":"/app.js")+"?_="+Date.now();document.head.appendChild(e);setTimeout(function(){done(false)},9000);});}function tunnel(){return fetch("tunnel.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}function dead(why){msg.innerHTML="<span class=dot style=\"background:#ff9f7f\"></span>班级电脑暂时没开机";tip.textContent=why||"";live.className="b";live.href="snapshot/";live.textContent="看离线相册（照片可下载）";var g=document.createElement("a");g.className="b p";g.href="galaxy.html";g.textContent="🌌 星河主题预览";document.getElementById("acts").appendChild(g);}msg.innerHTML="<span class=dot></span>正在连接班级电脑…";tunnel().then(function(t){var u=t&&t.url?t.url.replace(/\/+$/,""):"";if(!u){dead("没有找到实时通道记录。");return;}live.href=u;tip.textContent="实时通道："+u.replace(/^https:\/\//,"");return Promise.all([canary(u,"l"),canary(u,"s")]).then(function(a){if(a[0]||a[1]){msg.innerHTML="<span class=dot style=\"background:#7fffc4\"></span>已连接，正在进入官网…";setTimeout(function(){location.replace(u);},260);}else{dead("实时通道无响应（电脑关机或隧道已重启）。");setTimeout(function(){tunnel().then(function(t2){var u2=t2&&t2.url?t2.url.replace(/\/+$/,""):"";if(u2&&u2!==u){location.replace(u2);}});},6000);}});}).catch(function(){dead();});})();</script>

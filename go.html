<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="icon" href="favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>有爱21 · 班级官网</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{color:#eaf2ff;background-color:#03050e;background-image:radial-gradient(120% 82% at 78% 14%,rgba(99,102,241,.30),transparent 60%),radial-gradient(96% 72% at 10% 88%,rgba(14,165,233,.18),transparent 62%),linear-gradient(180deg,#050b20,#03060f 55%,#01020a);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
#gx{position:fixed;inset:0;z-index:0;pointer-events:none}
.neb{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(70px);opacity:.45}
.neb i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen}
.neb i:nth-child(1){width:46vw;height:46vw;left:56%;top:-14%;background:radial-gradient(circle at 40% 40%,#0ea5e9,transparent 68%);animation:d1 44s ease-in-out infinite}
.neb i:nth-child(2){width:38vw;height:38vw;left:-8%;top:44%;background:radial-gradient(circle at 50% 50%,#a78bfa,transparent 70%);animation:d2 56s ease-in-out infinite}
.neb i:nth-child(3){width:32vw;height:32vw;left:36%;top:74%;background:radial-gradient(circle at 50% 50%,#22d3ee,transparent 70%);opacity:.7;animation:d3 49s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vw,5vh) scale(1.12)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(7vw,-6vh) scale(.92)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(5vw,-9vh) scale(1.16)}}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(125% 105% at 50% 38%,transparent 52%,rgba(0,0,0,.55))}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.brand{font-weight:800;letter-spacing:6px;font-size:15px;color:rgba(234,242,255,.72)}
.brand em{font-style:normal;background:linear-gradient(90deg,#0ea5e9,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:10px 0 6px;font-size:clamp(40px,10vw,86px);font-weight:900;letter-spacing:6px;line-height:1;background:linear-gradient(118deg,#fff 8%,#7dd3fc 48%,#a78bfa 88%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(34,211,238,.30))}
.slogan{margin:0;font-size:14px;letter-spacing:4px;color:rgba(234,242,255,.66)}
.card{margin-top:30px;width:min(560px,94vw);padding:26px 22px;border-radius:24px;background:rgba(8,12,26,.66);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);box-shadow:0 30px 80px -40px #000}
.dot{width:12px;height:12px;border-radius:50%;margin:0 auto 14px;background:#22d3ee;box-shadow:0 0 0 0 rgba(34,211,238,.55);animation:pulse 1.6s infinite}
.dot.off{background:#fbbf24;box-shadow:0 0 0 0 rgba(251,191,36,.5)}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.msg{font-size:19px;font-weight:700;letter-spacing:1px}
.sub{margin-top:9px;font-size:13px;line-height:1.8;color:rgba(234,242,255,.56);word-break:break-all}
.acts{margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.20);color:#eaf2ff;transition:.25s}
.btn:hover{transform:translateY(-1px);border-color:#22d3ee}
button.btn{background:rgba(255,255,255,.06);font-family:inherit;cursor:pointer}
button.btn:disabled{opacity:.6}
button.btn.p{background:linear-gradient(120deg,#0ea5e9,#22d3ee)}
.btn.p{color:#04121e;background:linear-gradient(120deg,#0ea5e9,#22d3ee);border-color:transparent;box-shadow:0 14px 34px -14px rgba(14,165,233,.7)}
.foot{margin-top:26px;font-size:12px;line-height:2;color:rgba(234,242,255,.40)}
.foot b{color:rgba(234,242,255,.70);font-weight:600}
@media (max-width:560px){h1{letter-spacing:3px}.card{padding:22px 16px;border-radius:20px}}
</style></head><body>
<canvas id="gx"></canvas>
<div class="neb"><i></i><i></i><i></i></div><div class="vig"></div>
<main>
<div class="brand">有爱<em>21</em> · CLASS 21</div>
<h1>初一（21）班</h1>
<p class="slogan">团结有爱 · 积极奋进 · 包容互助</p>
<div class="card"><div class="dot" id="dot"></div><div class="msg" id="msg">正在连接班级电脑…</div>
<div class="sub" id="sub">首次进入约需 3 秒</div><div class="acts" id="acts"></div></div>
<div class="foot">永久入口 <b>lightning314.github.io/class21-site</b><br><span id="upd"></span></div>
</main>
<script src="galaxy.js"></script>
<script>
(function(){
 var D=document, P=function(s){return D.getElementById(s)};
 var msg=P("msg"),sub=P("sub"),acts=P("acts"),dot=P("dot"),upd=P("upd");
 var SCOPE=location.pathname.replace(/[^\/]*$/,"");
 var busy=false;
 if("serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register(SCOPE+"sw.js",{scope:SCOPE}); }catch(e){} }
 function btn(href,txt,primary){ var a=D.createElement("a"); a.href=href; a.className=primary?"btn p":"btn"; a.textContent=txt; return a; }
 function rbtn(txt,primary){ var b=D.createElement("button"); b.type="button"; b.className="btn rr" + (primary?" p":""); b.textContent=txt; return b; }
 function clear(){ while(acts.firstChild) acts.removeChild(acts.firstChild); }
 function wait_(t,s){ msg.textContent="正在连接班级电脑…"; dot.className="dot"; sub.textContent=s||"首次进入约需 3 秒"; }
 function enter(u){ msg.textContent="班级官网已就绪，正在进入…"; sub.textContent=u; setTimeout(function(){ location.replace(u); },260); }
 function out(j){ dot.className="dot off"; msg.textContent="官网暂时不在线"; sub.textContent="实时官网跑在班级电脑上：要电脑开着、且后台守护程序在运行才会在线。先看这份自动同步的相册，照片照样能下载。"; clear();
  acts.appendChild(btn("snapshot/","📷 看离线相册",true)); acts.appendChild(rbtn("🔄 再试一次"));
  upd.textContent = j && j.updated ? "通道最后在线 "+new Date(j.updated).toLocaleString("zh-CN") : "暂无通道记录"; }
 function probe(u,ms){ return new Promise(function(res){ var done=false,l=D.createElement("link");
  l.rel="preload"; l.as="script";
  var t=setTimeout(function(){ if(!done){done=true;l.onload=l.onerror=null;res(false);} },ms);
  l.onload=function(){ if(!done){done=true;clearTimeout(t);res(true);} };
  l.onerror=function(){ if(!done){done=true;clearTimeout(t);res(false);} };
  l.href=u+"/app.js?_="+(Date.now()); D.head.appendChild(l); }); }
 async function check(){ if(busy) return; busy=true;
  try{ var j=await fetch(SCOPE+"tunnel.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).catch(function(){return null;});
   if(!j||!j.url){ out(null); return; }
   upd.textContent="通道最后在线 "+(j.updated?new Date(j.updated).toLocaleString("zh-CN"):"未知");
   wait_(); var ok=await probe(j.url,6500);
   if(ok){ enter(j.url); } else { out(j); }
  } finally { busy=false; } }
 D.addEventListener("click",function(e){ var b=e.target.closest ? e.target.closest(".btn.rr") : null; if(!b) return; e.preventDefault(); if(b.disabled) return; b.disabled=true; b.textContent="🔄 连接中…"; setTimeout(function(){ b.disabled=false; b.textContent="🔄 再试一次"; },3500); check(); });
 wait_(); check();
 setInterval(function(){ if(!/没开机/.test(msg.textContent)) return; check(); },7000);
})();
</script></body></html>
